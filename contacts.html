<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECE8E1">
<title>Contacts</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/500.min.css" rel="stylesheet">
<link href="fonts/source-serif-4.css" rel="stylesheet">
<script>
  try { document.documentElement.dataset.side = localStorage.getItem("nyx_side") === "moon" ? "moon" : "sun"; } catch (e) { document.documentElement.dataset.side = "sun"; }
</script>
<link rel="stylesheet" href="app.css">
<style>
/* Contacts: every companion you talk to, each behind its own relay. A seal with the first character of the name, or a picture in the seal's place.
   Awake: the seal is pressed full. Asleep: the ink has dried, faded and grainy, and the name fades with it. Only the one you're talking to now is red. */
body.contacts{ overflow:auto; }
.ct{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 22px) 26px 60px; }
.ct .bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; }
.ct .bar a, .ct .bar button{ color:var(--soft); font:italic 15px var(--serif); text-decoration:none; }
.ct h1{ display:flex; align-items:baseline; gap:12px; margin:0 0 18px; font:500 30px/1.2 var(--serif); letter-spacing:.1em; }
.ct h1 small{ font:italic 400 20px var(--serif); color:var(--soft); letter-spacing:0; }
.ct h1 .cnt{ margin-left:auto; font:13px var(--serif); color:var(--faint); letter-spacing:.2em; }
.row{ display:flex; align-items:center; gap:18px; width:100%; padding:18px 0; border:0; background:none; color:var(--ink); text-align:left; font-family:var(--serif); cursor:pointer; -webkit-user-select:none; user-select:none; }
.seal{ position:relative; flex:none; width:54px; height:54px; border-radius:5px; display:grid; place-items:center; transform:rotate(-2deg); overflow:hidden;
  font:500 29px/1 var(--serif); color:var(--paper); background:var(--ink); }
.seal img{ width:100%; height:100%; object-fit:cover; display:block; }
.seal.pic{ background:none; }   /* a picture stands on its own, no frame */
.row.cur .seal{ background:var(--seal); } .row.cur .seal.pic{ background:none; }
.row.cur .seal.pic + span .nm{ color:var(--seal); }   /* with a picture, the red moves to the name */
.row.off .seal, .row.off .nm{ opacity:.45; }
.row.off .seal{ -webkit-mask:var(--grainmask) center/120px; mask:var(--grainmask) center/120px; }
.nm{ font-size:22px; font-weight:500; letter-spacing:.04em; }
.st{ font-size:13.5px; color:var(--soft); margin-top:3px; }
.row.off .st{ color:var(--faint); }
.t{ margin-left:auto; align-self:flex-start; margin-top:8px; font-size:12px; color:var(--faint); white-space:nowrap; }
svg.w{ display:block; width:100%; height:14px; color:var(--hair); }
.add{ display:block; width:100%; margin-top:20px; padding:14px 0; border:0; border-top:1px solid var(--hair); background:none; color:var(--faint); font:14px var(--serif); letter-spacing:.2em; cursor:pointer; }
.hint{ font-size:12px; color:var(--faint); text-align:center; margin-top:10px; letter-spacing:.06em; }
:root{ --seal:#B5553A; }
:root[data-side="moon"]{ --seal:#C9653F; }
/* night goes sparse: hollow seals, no time column */
:root[data-side="moon"] .seal:not(.pic){ background:none; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink); }
:root[data-side="moon"] .row.cur .seal:not(.pic){ background:none; color:var(--seal); box-shadow:inset 0 0 0 1.5px var(--seal); }
:root[data-side="moon"] .t{ display:none; }
/* the add / edit sheet */
.ed{ position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center; background:rgba(34,30,28,.12); }
:root[data-side="moon"] .ed{ background:rgba(0,0,0,.45); }
.ed[hidden]{ display:none; }
.ed form{ width:min(100% - 24px, 460px); margin-bottom:calc(env(safe-area-inset-bottom) + 12px); border-radius:26px; padding:22px 22px 18px; background:var(--paper); box-shadow:0 18px 50px rgba(40,25,18,.22); display:flex; flex-direction:column; gap:10px; }
:root[data-side="moon"] .ed form{ background:#17120F; }
.ed b{ font:500 20px var(--serif); letter-spacing:.08em; margin-bottom:4px; }
.ed label{ font-size:12px; color:var(--faint); letter-spacing:.12em; }
.ed input{ font:15px var(--serif); color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--hair); padding:6px 2px; border-radius:0; outline:none; width:100%; box-sizing:border-box; }
.ed .pic{ display:flex; align-items:center; gap:12px; }
.ed .pic .seal{ width:44px; height:44px; font-size:24px; }
.ed .pic button{ color:var(--soft); font:italic 14px var(--serif); }
.ed .acts{ display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }
.ed .acts button{ border-radius:999px; padding:8px 16px; font:14px var(--serif); letter-spacing:.06em; }
.ed .go{ background:var(--ink); color:var(--paper); }
.ed .del{ margin-right:auto; color:var(--seal); }
.ed .err{ font-size:12.5px; color:var(--seal); min-height:1em; }
</style>
</head>
<body class="contacts">
<div id="paper" aria-hidden="true"></div>
<div id="star" aria-hidden="true"></div>
<svg id="drops" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>
<main class="ct">
  <div class="bar"><a href="index.html">‹ Back</a></div>
  <h1>联系人 <small>Contacts</small><span class="cnt" id="cnt"></span></h1>
  <div id="list"></div>
  <button type="button" class="add" id="add">＋ 添 一 个</button>
  <p class="hint">按住一行可以改名字、换头像</p>
</main>
<div class="ed" id="ed" hidden><form id="form" autocomplete="off">
  <b id="edTitle">添一个</b>
  <div class="pic"><div class="seal" id="edSeal"></div><button type="button" id="edPic">换头像</button><button type="button" id="edNoPic">用名字</button><input type="file" id="edFile" accept="image/*" hidden></div>
  <label>名字</label><input id="edName" maxlength="16" required>
  <label>后台地址</label><input id="edRelay" placeholder="/relay-codex" required>
  <label>钥匙</label><input id="edKey" type="password" required>
  <div class="err" id="edErr"></div>
  <div class="acts"><button type="button" class="del" id="edDel">删掉</button><button type="button" id="edX">算了</button><button type="submit" class="go">好</button></div>
</form></div>
<script src="config.js"></script>
<script src="paper.js"></script>
<script>
(function () {
  "use strict";
  var C = window.NYX || {}, $ = function (id) { return document.getElementById(id); };
  if (window.NyxPaper) NyxPaper.paint();
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // grain for a dried seal: a speckled mask drawn once
  (function () { var c = document.createElement("canvas"); c.width = c.height = 120; var x = c.getContext("2d"), d = x.createImageData(120, 120);
    for (var i = 0; i < d.data.length; i += 4) { var v = Math.random(); d.data[i + 3] = v < .22 ? 0 : v < .4 ? 120 : 255; }
    x.putImageData(d, 0, 0); document.documentElement.style.setProperty("--grainmask", "url(" + c.toDataURL() + ")"); })();

  // the list lives on this phone; the first entry is the relay this Nyx was installed with
  var list = []; try { list = JSON.parse(get("nyx_contacts") || "[]"); } catch (e) {}
  if (!list.length) list = [{ name: C.aiName || "Companion", relay: C.relay || "/relay", key: get("nyx_key") || "" }];
  function save() { return set("nyx_contacts", JSON.stringify(list)); }
  if (list[0].key) save();   // never seed an entry with no key; the gate fills it in once you're through
  var curRelay = get("nyx_relay") || C.relay || "/relay";

  var CN = "零一二三四五六七八九";
  function cn(n) { if (n < 10) return CN[n]; if (n < 20) return "十" + (n % 10 ? CN[n % 10] : ""); return CN[Math.floor(n / 10)] + "十" + (n % 10 ? CN[n % 10] : ""); }
  function ago(sec) {   // all in Chinese numerals, one way of writing time down the column
    if (sec == null) return ""; var m = Math.floor(sec / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
    return m < 1 ? "刚刚" : m < 60 ? cn(m) + "分钟前" : h < 24 ? cn(h) + "小时前" : d < 31 ? cn(d) + "天前" : "很久以前"; }
  function seal(c) { return c.avatar ? '<div class="seal pic"><img src="' + esc(c.avatar) + '" alt=""></div>' : '<div class="seal">' + esc(Array.from(c.name || "?")[0]) + "</div>"; }
  var wave = '<svg class="w" viewBox="0 0 390 14" preserveAspectRatio="none"><path d="M0 7 C 52 1, 92 13, 147 7 S 242 2, 390 8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';

  function paint() {
    $("cnt").textContent = (list.length <= 9 ? cn(list.length) : list.length) + " 位";
    $("list").innerHTML = list.map(function (c, i) {
      return '<button type="button" class="row' + (c.relay === curRelay ? " cur" : "") + (c.off ? " off" : "") + '" data-i="' + i + '">' + seal(c) +
        '<span><div class="nm">' + esc(c.name) + '</div><div class="st">' + (c.off == null ? "…" : c.off ? "睡着了" : "醒着") + "</div></span>" +
        '<span class="t">' + esc(c.ago || "") + "</span></button>";
    }).join(wave);
  }
  // awake = the AI side is holding its line open on that relay (/healthz, no key needed); the time is the last message either way (/app/status)
  function probe(c) {
    var base = c.relay.replace(/\/$/, "");
    fetch(base + "/healthz", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (h) { c.off = !(h.plugin_subs > 0); })
      .catch(function () { c.off = true; }).then(paint);
    if (c.key) fetch(base + "/app/status", { headers: { Authorization: "Bearer " + c.key }, cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) { if (s) { c.ago = ago(s.last_msg_age_sec); paint(); } }).catch(function () {});
  }
  paint(); list.forEach(probe);

  // tap: talk to them. Every page reads nyx_relay / nyx_key / nyx_ai, so the town, Listen, the kitchen and the hold follow too
  var pressed = false, timer = null;
  $("list").addEventListener("pointerdown", function (e) { var b = e.target.closest("[data-i]"); if (!b) return; pressed = false; timer = setTimeout(function () { pressed = true; edit(+b.dataset.i); }, 550); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { $("list").addEventListener(t, function () { clearTimeout(timer); }); });
  $("list").addEventListener("contextmenu", function (e) { e.preventDefault(); });
  $("list").onclick = function (e) {
    var b = e.target.closest("[data-i]"); if (!b || pressed) return;
    var c = list[+b.dataset.i]; set("nyx_relay", c.relay); set("nyx_key", c.key); set("nyx_ai", c.name);
    location.href = "index.html#chat";
  };

  // add / edit
  var editing = -1, pic = null;
  function edSeal() { $("edSeal").outerHTML = seal({ name: $("edName").value || "?", avatar: pic }).replace('class="seal', 'id="edSeal" class="seal'); }
  function edit(i) {
    editing = i; var c = i >= 0 ? list[i] : { name: "", relay: "", key: "" }; pic = c.avatar || null;
    $("edTitle").textContent = i >= 0 ? "改一改" : "添一个"; $("edName").value = c.name; $("edRelay").value = c.relay; $("edKey").value = c.key;
    $("edDel").hidden = i < 0 || list.length < 2; $("edErr").textContent = ""; edSeal(); $("ed").hidden = false;
  }
  $("add").onclick = function () { edit(-1); };
  $("edX").onclick = function () { $("ed").hidden = true; };
  $("ed").onclick = function (e) { if (e.target === $("ed")) $("ed").hidden = true; };
  $("edName").oninput = edSeal;
  $("edPic").onclick = function () { $("edFile").click(); };
  $("edNoPic").onclick = function () { pic = null; edSeal(); };
  $("edFile").onchange = function () {   // shrink to 160px so it fits in localStorage
    var f = this.files[0]; if (!f) return; var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () { var s = 160, c = document.createElement("canvas"); c.width = c.height = s; var x = c.getContext("2d"), m = Math.min(img.width, img.height);
      x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s); pic = c.toDataURL("image/jpeg", .82); URL.revokeObjectURL(url); edSeal(); };
    img.src = url; this.value = "";
  };
  $("edDel").onclick = function () {
    var c = list[editing]; list.splice(editing, 1); save();
    if (c.relay === curRelay) { var n = list[0]; set("nyx_relay", n.relay); set("nyx_key", n.key); set("nyx_ai", n.name); curRelay = n.relay; }
    $("ed").hidden = true; paint();
  };
  $("form").onsubmit = function (e) {
    e.preventDefault();
    var c = { name: $("edName").value.trim(), relay: $("edRelay").value.trim().replace(/\/$/, ""), key: $("edKey").value.trim(), avatar: pic || undefined };
    if (!c.name || !c.relay || !c.key) return;
    if (c.relay.charAt(0) !== "/") { $("edErr").textContent = "这一版只接同一个网址下的后台，地址以 / 开头，比如 /relay-codex"; return; }   // another server: pictures and push would break, next version
    $("edErr").textContent = "敲一下门…";
    fetch(c.relay + "/app/status", { headers: { Authorization: "Bearer " + c.key }, cache: "no-store" }).then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error("钥匙不对");
      if (!r.ok) throw new Error("这个地址没有应门");
      if (editing >= 0) { if (list[editing].relay === curRelay) { set("nyx_relay", c.relay); set("nyx_key", c.key); set("nyx_ai", c.name); curRelay = c.relay; } list[editing] = c; } else list.push(c);
      if (!save()) { $("edErr").textContent = "手机里放不下了，头像换小一点"; return; }
      $("ed").hidden = true; paint(); probe(c);
    }).catch(function (err) { $("edErr").textContent = err.message === "Failed to fetch" ? "这个地址够不着" : err.message; });
  };
})();
</script>
</body>
</html>
